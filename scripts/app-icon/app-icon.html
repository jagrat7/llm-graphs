<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        width: 512px;
        height: 512px;
        display: grid;
        place-items: center;
      }
      svg {
        width: 460px;
        height: 460px;
        color: #c8102e;
      }

  </head>
  <body>
    <svg viewBox="0 0 24 24">

      <g transform="rotate(-12 12 12)" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="10.6" stroke-width="1.5" />
        <circle cx="12" cy="12" r="5.8" stroke-width=".9" />
        <path
          d="M9 12.2l2.1 2.1 4-4.3"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </g>
      <g transform="rotate(-12 12 12)">
        <text
          font-family="Bebas Neue"
          font-size="3.3"
          fill="currentColor"
          textLength="45.8"
          lengthAdjust="spacing"
        >
          <textPath href="#ring">TRUST ME BRO · TRUST ME BRO ·</textPath>
        </text>
      </g>
    </svg>
  </body>
</html>
